<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Munim, merchant copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#00BAF2;--navy:#002970;--ink:#0B1F3A;--mute:#5B6B82;--line:#E3E8EF;--bg:#F4F8FB;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","Noto Sans Devanagari",system-ui,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.logout{background:transparent;border:1px solid #fff;color:#fff;border-radius:6px;padding:6px 10px;min-height:40px}
.login{max-width:360px;width:100%;margin:auto}
.login label{display:block;font-weight:700;margin-bottom:6px}
.login input{width:100%;font:inherit;border:1.5px solid var(--navy);border-radius:8px;padding:10px 12px;min-height:44px;margin-bottom:12px}
.login-error{color:#B3261E;margin-top:10px}
.auth-toggle{background:none;border:0;color:var(--navy);text-decoration:underline;padding:10px 0}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
header{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:18px 18px 20px}
header h1{font-size:19px;line-height:1.25;margin:0;font-weight:700}
header p{margin:2px 0 0;color:#B8C7E0;font-size:13px}
.lang{display:flex;border:1.5px solid #fff;border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:6px 11px;font-weight:700;font-size:14px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
body.home header{padding-bottom:58px}
main{flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px;animation:in .25s ease-out}
body.home main{padding-top:0}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
.note{font-size:12.5px;color:var(--mute);margin:0}
h2{font-size:17px;line-height:1.3;font-weight:700;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card p{margin:0}
.hero{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:12px;padding:18px;margin-top:-42px;box-shadow:0 6px 18px rgba(0,41,112,.12)}
.hero .lbl{color:var(--mute);font-size:14px}
.hero .amt{font-size:36px;font-weight:700;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
.delta{font-size:14px;font-weight:500}.delta.dn{color:#B3261E}.delta.up{color:#0A7A45}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;color:var(--mute);font-size:14px}
.qas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink)}
.ic{width:40px;height:40px;border-radius:50%;background:#E6F8FE;display:grid;place-items:center;color:var(--navy)}
.ic svg,nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:#E6F8FE;color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:14px}
.tx b{display:block;font-weight:500}.tx small{color:var(--mute)}
.tx strong{color:#0A7A45;font-variant-numeric:tabular-nums}
.btn{background:var(--navy);color:#fff;border:1.5px solid var(--navy);border-radius:8px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.alt{background:#fff;color:var(--navy)}
.btn:disabled{opacity:.6;cursor:default}
nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:500;color:var(--mute);border-top:3px solid transparent;margin-top:-1px}
nav button[aria-current="page"]{border-top-color:var(--blue);color:var(--navy);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .btn{font-weight:500;padding:8px 12px;min-height:40px;text-align:left}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 14px;border-radius:12px;max-width:92%;border:1px solid var(--line);background:#fff;align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-color:var(--navy)}
.msg p{margin:0}
details{margin-top:8px;font-size:13px;color:var(--mute)}
summary{cursor:pointer;font-weight:700}
details ul{margin:6px 0 0;padding-left:18px}
.cust{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cust:last-child{border-bottom:0}
.cust b{display:block;font-weight:500}.cust small{color:var(--mute)}
.draft{margin-top:12px;padding:12px;border:1.5px dashed var(--navy);border-radius:10px}
.draft p{margin:0 0 12px}
.askf{display:flex;gap:8px}
.askf input{flex:1;min-width:0;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--navy);border-radius:8px;padding:10px 12px;min-height:44px}
.askf input::placeholder{color:var(--mute)}
.paytm-form label{display:block;font-weight:700;margin:10px 0 6px}
.paytm-form input{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.paytm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.paytm-error{color:#B3261E;margin-top:10px}
.bars{width:100%;height:auto;display:block;color:var(--blue);margin-top:4px}
.bars text{fill:var(--ink);font:12px "DM Sans",sans-serif}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="shop">Sharma General Store</h1><p id="sub"></p></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en" aria-pressed="true">EN</button><button data-l="hi" aria-pressed="false">हिं</button>
    </div>
    <button id="logout" class="logout" type="button" hidden>Log out</button>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
